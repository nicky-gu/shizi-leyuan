<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三角洲行动·识字特训营 🪖 二年级生字 20 天</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== 首次使用：设置开始日期 ===== -->
<div id="setupModal" class="modal hidden">
  <div class="modal-card">
    <h2>🪖 欢迎加入三角洲行动·识字特训营！</h2>
    <p>干员，我们将在 <b>20 天</b>里攻克二年级上册 <b>607 个生字</b>。<br>每天新训 + 按记忆曲线巩固旧字。</p>
    <p>请设定你的入营日期：</p>
    <input type="date" id="startDateInput">
    <div class="modal-btns">
      <button class="btn btn-primary" onclick="saveStartDate()">入营报到 🪖</button>
    </div>
    <p class="tip">📌 作战记录存于本机浏览器，请每天用同一设备训练哦</p>
  </div>
</div>

<!-- ===== 顶部导航 ===== -->
<header>
  <div class="logo" onclick="go('home')"><img src="assets/logo.png" alt="三角洲行动" class="header-logo">三角洲识字特训营</div>
  <nav>
    <button class="nav-btn" id="nav-home" onclick="go('home')">🏠 基地</button>
    <button class="nav-btn" id="nav-study" onclick="go('study')">🎯 今日特训</button>
    <button class="nav-btn" id="nav-review" onclick="go('review')">🔄 战术复习</button>
    <button class="nav-btn" id="nav-stats" onclick="go('stats')">📋 作战报告</button>
    <button class="nav-btn" id="nav-sync" onclick="openSyncModal()">📡 同步</button>
  </nav>
</header>

<!-- ===== 跨终端同步弹窗 ===== -->
<div id="syncModal" class="modal hidden">
  <div class="modal-card">
    <h2>📡 跨终端同步</h2>
    <div id="syncBody"></div>
    <div class="modal-btns" style="margin-top:14px">
      <button class="btn btn-yellow" onclick="closeSyncModal()">关闭</button>
    </div>
  </div>
</div>

<main>
  <!-- ===== 首页 ===== -->
  <section id="page-home" class="page"></section>

  <!-- ===== 学习页 ===== -->
  <section id="page-study" class="page hidden"></section>

  <!-- ===== 复习页 ===== -->
  <section id="page-review" class="page hidden"></section>

  <!-- ===== 报告页 ===== -->
  <section id="page-stats" class="page hidden"></section>

  <!-- ===== 游戏/练习容器 ===== -->
  <section id="page-game" class="page hidden">
    <div id="gameArea"></div>
  </section>
</main>

<!-- ===== 完成庆祝弹窗 ===== -->
<div id="celebrateModal" class="modal hidden">
  <div class="modal-card celebrate">
    <div id="celebrateContent"></div>
    <button class="btn btn-primary" onclick="closeCelebrate()">收到！🫡</button>
  </div>
</div>

<div class="attribution">
  视觉素材来自 <a href="https://df.qq.com" target="_blank" rel="noopener">三角洲行动官方</a>，仅供个人非商用学习使用 ｜ © 天美工作室群
</div>

<img src="assets/knife.jpg" alt="" class="knife-deco" aria-hidden="true">

<audio id="dingSound" preload="auto"></audio>

<script src="data.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
